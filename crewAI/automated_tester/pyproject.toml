[project]
name = "automated_tester"
version = "0.1.0"
description = "automated-tester using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.5.0",
]

[project.scripts]
automated_tester = "automated_tester.main:run"
run_crew = "automated_tester.main:run"
train = "automated_tester.main:train"
replay = "automated_tester.main:replay"
test = "automated_tester.main:test"
run_with_trigger = "automated_tester.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
